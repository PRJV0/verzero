<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="">
  <!-- FOTO SEGNAPOSTO (astratta, locale): sostituire con lo scatto reale del
       fondatore (orizzonte/campagna/impianto) mantenendo lo stesso path.
       Duotone verde applicato dal componente PhotoDuotone. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efefef"/>
      <stop offset="1" stop-color="#b5b5b5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="600" fill="url(#cielo)"/>
  <circle cx="1240" cy="140" r="90" fill="#fafafa" filter="url(#soft)"/>
  <path d="M0 430 Q 300 330 640 400 T 1600 380 V 600 H 0 Z" fill="#7a7a7a" filter="url(#soft)"/>
  <path d="M0 500 Q 420 420 900 480 T 1600 470 V 600 H 0 Z" fill="#565656"/>
  <!-- filari stilizzati -->
  <g stroke="#3f3f3f" stroke-width="7" opacity="0.5">
    <path d="M 140 600 L 320 505" fill="none"/>
    <path d="M 360 600 L 500 512" fill="none"/>
    <path d="M 600 600 L 705 520" fill="none"/>
    <path d="M 860 600 L 930 528" fill="none"/>
    <path d="M 1120 600 L 1165 532" fill="none"/>
  </g>
</svg>
